name: Alix
description: 'Alix is an estate settlement service that pairs technology with human
  experts — Settlement Specialists, fiduciaries, CPAs, and probate attorneys — to
  execute the 150+ administrative, legal, financial, and tax tasks required to settle
  an estate after a death. It coordinates probate court filings, asset discovery (50-state
  unclaimed-property and federal life-insurance searches, hidden 401(k)s and bank
  accounts), estate bank-account and IRS EIN setup, creditor and debt negotiation,
  final personal (1040) and estate (1041) tax filings, property liquidation and estate
  sales, and the legally compliant distribution of funds to beneficiaries — while
  keeping the executor informed through a dedicated app. Alix charges a flat 1% of
  gross estate value (minimum $9,000, $2,500 initial deposit). Backed by Initialized
  Capital.'
